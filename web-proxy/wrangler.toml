# earllnRainOrNot 웹앱(아이폰 등 브라우저)용 중계 서버
# 브라우저는 CORS 때문에 TOPIS/ITS/CCTV 영상에 직접 접근할 수 없어 이 Worker 가 대신 받아 준다.
name = "earllnrainornot-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# earlln.com 아래 /rain-api/* 로도 연결한다 (같은 사이트 주소라 CORS 불필요, workers.dev 차단 회피).
# 이 경로 외의 earlln.com 페이지에는 영향 없음.
routes = [
  { pattern = "earlln.com/rain-api/*", zone_name = "earlln.com" },
  { pattern = "www.earlln.com/rain-api/*", zone_name = "earlln.com" },
]

[vars]
ALLOWED_ORIGINS = "https://earlln.com,https://www.earlln.com"
TOPIS_BASE = "https://topis.seoul.go.kr"
ITS_BASE = "https://openapi.its.go.kr:9443"
# 비밀값(SIGNING_KEY, ITS_API_KEY)은 배포 워크플로가 `wrangler secret put` 으로 넣는다.
