name: Release APK

# v 로 시작하는 태그(예: v2.0.0)를 푸시하면 서명된 release APK 를 만들어 GitHub Release 에 첨부합니다.
# 홈페이지 링크: https://github.com/earlln/earllnRainOrNot/releases/latest/download/earllnRainOrNot.apk
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret 이 없습니다. 고정 서명 없이는 업데이트 설치가 불가능하므로 릴리스를 중단합니다."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Gemini 키는 release 빌드에 넣지 않습니다(build.gradle.kts). ITS 키만 주입합니다.
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          export VERSION_CODE=$((VERSION_CODE + 100))
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk earllnRainOrNot.apk
          # 서명 확인 (서명되지 않았으면 실패)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs earllnRainOrNot.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: earllnRainOrNot.apk
          generate_release_notes: true
          body: |
            ## 설치 방법
            1. 아래 `earllnRainOrNot.apk` 를 내려받아 설치합니다 (출처를 알 수 없는 앱 설치 허용 필요, Android 7.0 이상).
            2. 앱 실행 후 **설정 > API 키** 에 Google AI Studio 에서 발급받은 Gemini API 키를 입력합니다.
