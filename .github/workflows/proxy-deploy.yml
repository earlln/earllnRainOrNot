name: Deploy web proxy (Cloudflare Worker)

# 웹앱(아이폰 등 브라우저)용 중계 서버를 Cloudflare Workers 에 배포합니다.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (선택: ITS_API_KEY)
on:
  push:
    paths: ['web-proxy/**', '.github/workflows/proxy-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret 이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy worker
        if: steps.cf.outputs.skip != 'true'
        run: npx --yes wrangler@3.80.0 deploy | tee deploy.log

      - name: Set secrets
        if: steps.cf.outputs.skip != 'true'
        env:
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
        run: |
          # 서명 키는 배포마다 새로 만든다 (서명 주소는 15분짜리라 바뀌어도 문제 없음)
          openssl rand -hex 32 | npx --yes wrangler@3.80.0 secret put SIGNING_KEY
          if [ -n "$ITS_API_KEY" ]; then printf '%s' "$ITS_API_KEY" | npx --yes wrangler@3.80.0 secret put ITS_API_KEY; fi

      - name: Show worker URL
        if: steps.cf.outputs.skip != 'true'
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $url"
          echo "### Worker URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (live)
        if: steps.cf.outputs.skip != 'true'
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          node scripts/smoke.mjs "$url" | tee smoke.log
          { echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
