name: Deploy web proxy (Cloudflare Worker)

# 웹앱(아이폰 등 브라우저)용 중계 서버를 Cloudflare Workers 에 배포합니다.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# ITS(국도) 키는 넣지 않는다: ITS 서버가 해외 접속을 막고, 키는 사용자가 각자 발급받아 입력한다.
on:
  push:
    paths: ['web-proxy/**', '.github/workflows/proxy-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret 이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy worker
        if: steps.cf.outputs.skip != 'true'
        run: npx --yes wrangler@3.80.0 deploy | tee deploy.log

      - name: Set secrets
        if: steps.cf.outputs.skip != 'true'
        run: |
          # 서명 키는 처음 한 번만 만든다 (배포마다 바꾸면 전파되는 동안 서명 검증이 실패함)
          if ! npx --yes wrangler@3.80.0 secret list | grep -q '"SIGNING_KEY"'; then
            openssl rand -hex 32 | npx --yes wrangler@3.80.0 secret put SIGNING_KEY
          fi
          # 예전에 넣은 ITS 키가 남아 있으면 지운다 (기본 키를 제공하지 않음)
          if npx --yes wrangler@3.80.0 secret list | grep -q '"ITS_API_KEY"'; then yes | npx --yes wrangler@3.80.0 secret delete ITS_API_KEY || true; fi

      - name: Show worker URL
        if: steps.cf.outputs.skip != 'true'
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $url"
          echo "### Worker URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (live)
        if: steps.cf.outputs.skip != 'true'
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          node scripts/smoke.mjs "$url" | tee smoke.log
          { echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f diag-target.txt ]; then read -r h p < diag-target.txt; bash scripts/diag-media.sh "$h" "$p" | tee -a smoke.log; fi
          bash scripts/fetch-intermediate.sh topiscctv1.eseoul.go.kr || true
          bash scripts/diag-web.sh "$url" || true
