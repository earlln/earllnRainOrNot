name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록한 값이 APK 에 주입됩니다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::warning::GEMINI_API_KEY secret 이 없어 분석 기능이 동작하지 않는 APK 가 만들어집니다."; fi
          if [ -z "$ITS_API_KEY" ]; then echo "::warning::ITS_API_KEY secret 이 없어 ITS(국도) CCTV 가 제외됩니다."; fi
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: earllnRainOrNot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
